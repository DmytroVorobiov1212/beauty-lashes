name: Framework major refresh

on:
  push:
    branches:
      - upgrade/foundation-polish

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[framework-refresh]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/foundation-polish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade framework and runtime packages
        run: |
          npm install --save-exact next@16.3.5 react@19.2.8 react-dom@19.2.8 next-intl@4.13.7 swiper@14.2.0
          npm install --save-dev --save-exact eslint-config-next@16.3.5

      - name: Apply non-breaking audit fixes
        run: npm audit fix

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit generated dependency changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade to Next.js 16.3.5 and secure frontend dependencies"
            git push origin HEAD:upgrade/foundation-polish
          fi
